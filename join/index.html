<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <title>Blimpr — Uitnodiging</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: sans-serif; background: #F7F1E8; display: flex;
           flex-direction: column; align-items: center; justify-content: center;
           min-height: 100vh; margin: 0; padding: 24px; box-sizing: border-box; }
    h1   { color: #FF6B35; font-size: 28px; margin-bottom: 8px; }
    p    { color: #5F5E5A; text-align: center; margin-bottom: 32px; }
    .code { font-size: 22px; font-weight: bold; color: #1A1A2E;
            background: #fff; padding: 16px 32px; border-radius: 12px;
            border: 1.5px solid #D3D1C7; margin-bottom: 32px; letter-spacing: 2px; }
    a    { background: #FF6B35; color: #fff; text-decoration: none;
           padding: 16px 32px; border-radius: 12px; font-size: 16px; font-weight: 600; }
  </style>
</head>
<body>
  <h1>blimpr</h1>
  <p>Je bent uitgenodigd om samen een reis te plannen.</p>
  <div class="code" id="code-display"></div>
  <a id="store-link" href="#">Open Blimpr</a>
  <p style="margin-top:16px;font-size:13px;">
    Geen app? Download Blimpr en voer de code hierboven in.
  </p>
  <script>
    const code = location.pathname.split('/').filter(Boolean).pop() || '';
    document.getElementById('code-display').textContent = code;

    const isIOS     = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const isAndroid = /android/i.test(navigator.userAgent);
    const deepLink  = 'blimpr://groep/' + code;
    const storeLink = isIOS
      ? 'https://apps.apple.com/app/blimpr/idXXXXXXXXX'   // fill in after App Store listing
      : 'https://play.google.com/store/apps/details?id=com.blimpr.app';

    const storeAnchor = document.getElementById('store-link');
    storeAnchor.href  = storeLink;
    storeAnchor.textContent = isIOS ? 'Download in de App Store' : 'Download in de Play Store';

    // Try to open the app; fall through to store if not installed
    if (isIOS || isAndroid) {
      window.location = deepLink;
      setTimeout(() => { window.location = storeLink; }, 1500);
    }
  </script>
</body>
</html>
